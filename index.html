<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    margin: 0;
    background: #090d16;

  }
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: #111827;
    border-bottom: 1px solid #263248;
    padding: 10px 12px;
  }
  .title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  h1 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: 0.3px; }
  .stage-nav {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .nav-step {
    background: #182234;
    color: #f3f4f6;
    border: 1px solid #263248;
    padding: 5px 10px;
    font-size: 14px;
    font-weight: 800;
    line-height: 1.1;
  }
  .nav-step:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .btn-row { display: flex; gap: 6px; overflow-x: auto; }
  select, button, input {
    font-family: inherit;
    border-radius: 7px;
    border: 1px solid #263248;
    font-weight: 700;
  }
  select { background: #182234; color: #f3f4f6; padding: 5px 8px; font-size: 13px; }
  button { cursor: pointer; color: #fff; padding: 6px 9px; font-size: 11px; border: none; white-space: nowrap; }
  .b-green { background: #16a34a; }
  .b-blue { background: #2563eb; }
  .b-purple { background: #7c3aed; }
  .b-red { background: #dc2626; }
  .b-grey { background: #4b5563; }
  .b-amber { background: #d97706; color: #000; }
  .b-teal { background: #0d9488; }

  main { padding: 10px 12px; display: none; }
  main.active { display: block; }

  .round-banner {
    background: #172033;
    border: 1px solid #2c3b59;
    color: #38bdf8;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .pending-note {
    background: #111827;
    border: 1px dashed #334155;
    color: #9ca3af;
    border-radius: 10px;
    padding: 12px;
    font-size: 12px;
    margin-bottom: 8px;
    text-align: center;
  }
  .card {
    background: #111827;
    border: 1px solid #263248;
    border-radius: 10px;
    padding: 8px;
    margin-bottom: 8px;
  }
  .game-sub {
    font-size: 10px;
    font-weight: 800;
    color: #9ca3af;
    text-transform: uppercase;
    margin-bottom: 5px;
    padding-left: 2px;
  }
  .team-pick-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    background: #182234;
    border-radius: 7px;
    padding: 6px 8px;
    margin-bottom: 5px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .team-pick-row.winner { background: #14532d; border-color: #22c55e; }
  .team-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .tm-logo-lg {
    width: 24px;
    height: 24px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .tm-logo-sm {
    width: 17px;
    height: 17px;
    object-fit: contain;
    vertical-align: middle;
    margin-right: 4px;
  }
  .badge-fallback {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 30px; height: 20px; padding: 0 4px; border-radius: 5px;
    font-size: 10px; font-weight: 900; flex-shrink: 0;
  }
  .team-meta { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pct-tag { color: #38bdf8; font-variant-numeric: tabular-nums; font-size: 11px; }
  .score-box { width: 42px; padding: 4px; text-align: center; background: #0b111e; color: #fff; font-size: 12px; }
  .card-actions { display: flex; gap: 5px; justify-content: flex-end; }
  .hidden-el { display: none !important; }

  .view-pills { display: flex; gap: 6px; margin-bottom: 10px; }
  .pill { flex: 1; background: #111827; color: #9ca3af; border: 1px solid #263248; padding: 7px; font-size: 12px; border-radius: 8px; }
  .pill.active { background: #2563eb; color: #fff; border-color: #2563eb; }

  table { width: 100%; border-collapse: collapse; font-size: 11px; font-variant-numeric: tabular-nums; }
  th { background: #1e293b; color: #38bdf8; padding: 6px 4px; text-align: center; }
  td { padding: 5px 4px; border-bottom: 1px solid #1c2536; text-align: center; }
  td.tm-cell { text-align: left; font-weight: 700; white-space: nowrap; }
  .group-hdr td { background: #172033; color: #fff; font-weight: 800; text-align: left; padding-left: 8px; }
  .seed-1 td { color: #fbbf24; background: rgba(251, 191, 36, 0.08); }
  .seed-div td { color: #34d399; background: rgba(52, 211, 153, 0.07); }
  .seed-wc td { color: #38bdf8; background: rgba(56, 189, 248, 0.07); }
  .seed-out td { color: #6b7280; opacity: 0.65; }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; font-weight: 700; margin-bottom: 8px; }
  .l-1 { color: #fbbf24; }
  .l-div { color: #34d399; }
  .l-wc { color: #38bdf8; }
  .l-out { color: #6b7280; }

  .bracket-out {
    white-space: pre-wrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px; line-height: 1.45;
    background: #0c1220; padding: 10px; border-radius: 8px; border: 1px solid #263248; margin-top: 10px;

  nav.bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: #111827; border-top: 1px solid #263248;
  }
  nav.bottom-nav button { border-radius: 0; background: transparent; color: #9ca3af; padding: 12px 4px; font-size: 11px; }
  nav.bottom-nav button.active { color: #fff; background: #1e293b; border-top: 2px solid #38bdf8; }
</style>

<header>

  </div>
</header>

<main id="tab-games" class="active">
  <div id="gamesList"></div>
</main>

<main id="tab-standings">

    <button id="pill-Division" class="pill active" onclick="setStandingsMode('Division')">Division</button>
    <button id="pill-Conference" class="pill" onclick="setStandingsMode('Conference')">Conference</button>
    <button id="pill-League" class="pill" onclick="setStandingsMode('League')">League</button>

  <div class="card" style="padding:0; overflow-x:auto;">

      <thead>
        <tr>

          <th class="stat-col">PPG</th><th class="stat-col">PPA</th><th class="stat-col">DIFF</th>
        </tr>
      </thead>
      <tbody id="standingsBody"></tbody>
    </table>
  </div>
</main>

<main id="tab-team">
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
      <select id="teamSelect"></select>
      <span id="teamSummary" style="font-size:12px; font-weight:800; color:#34d399;"></span>
    </div>
  </div>
  <div class="card" style="padding:0; overflow-x:auto;">
    <table>
      <thead>
        <tr>
          <th>WK</th><th>OPP</th><th>RES</th><th>SCORE</th><th>WIN%</th>
          <th class="stat-col">PPG</th><th class="stat-col">PPA</th>
        </tr>
      </thead>
      <tbody id="teamSchedBody"></tbody>
    </table>
  </div>
</main>

<main id="tab-playoffs">
  <div class="card">
    <div style="font-size:13px; font-weight:800; margin-bottom:6px;">Playoff Picture</div>
    <div class="legend">
      <span class="l-1">&#9632; #1 Bye</span>
      <span class="l-div">&#9632; #2-#4 Div Champs</span>
      <span class="l-wc">&#9632; #5-#7 Wild Card</span>
      <span class="l-out">&#9632; #8+ Out</span>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
      <div>
        <div style="font-size:11px; font-weight:800; color:#38bdf8; margin-bottom:4px;">AFC SEEDS</div>
        <table>
          <thead><tr><th>#</th><th>TM</th><th>REC</th><th>WIN%</th></tr></thead>
          <tbody id="afcSeedsBody"></tbody>
        </table>
      </div>
      <div>
        <div style="font-size:11px; font-weight:800; color:#34d399; margin-bottom:4px;">NFC SEEDS</div>
        <table>
          <thead><tr><th>#</th><th>TM</th><th>REC</th><th>WIN%</th></tr></thead>
          <tbody id="nfcSeedsBody"></tbody>
        </table>
      </div>
    </div>
    <div id="bracketOutput" class="bracket-out">Play through Weeks 1–18 or jump to WC / DIV / CCG / SB in the stage selector, or tap "Sim Playoffs".</div>
  </div>
</main>

  <button id="nav-games" class="active" onclick="switchTab('games')">Games</button>
  <button id="nav-standings" onclick="switchTab('standings')">Standings</button>
  <button id="nav-team" onclick="switchTab('team')">Team</button>

</nav>

function generateBalanced18WeekSchedule() {
  var keys = Object.keys(TEAMS);
  var byeWeeks = [5, 6, 7, 8, 9, 10, 11, 12];
  var shuffledTeams = keys.slice().sort(function() { return Math.random() - 0.5; });
  var weekByes = {};
  for (var w = 1; w <= 18; w++) weekByes[w] = {};
  for (var idx = 0; idx < shuffledTeams.length; idx++) {
    weekByes[byeWeeks[idx % byeWeeks.length]][shuffledTeams[idx]] = true;
  }

  var schedByWk = {};
  for (var wk = 1; wk <= 18; wk++) schedByWk[wk] = [];

  var teamGamesCount = {};
  var playedPair = {};
  for (var k = 0; k < keys.length; k++) teamGamesCount[keys[k]] = 0;

  var allPairs = [];
  for (var x = 0; x < keys.length; x++) {
    for (var y = x + 1; y < keys.length; y++) {
      allPairs.push([keys[x], keys[y]]);
    }
  }
  allPairs.sort(function() { return Math.random() - 0.5; });

  for (var p = 0; p < allPairs.length; p++) {
    var t1 = allPairs[p][0], t2 = allPairs[p][1];
    if (teamGamesCount[t1] >= 17 || teamGamesCount[t2] >= 17) continue;
    for (var wTry = 1; wTry <= 18; wTry++) {
      if (weekByes[wTry][t1] || weekByes[wTry][t2]) continue;
      var busy = false;
      for (var gIdx = 0; gIdx < schedByWk[wTry].length; gIdx++) {
        var ex = schedByWk[wTry][gIdx];
        if (ex[0] === t1 || ex[1] === t1 || ex[0] === t2 || ex[1] === t2) { busy = true; break; }
      }
      if (!busy) {
        schedByWk[wTry].push(Math.random() < 0.5 ? [t1, t2] : [t2, t1]);
        playedPair[t1 + "-" + t2] = true;
        teamGamesCount[t1]++;
        teamGamesCount[t2]++;
        break;
      }
    }
  }

  for (var pass = 0; pass < 3; pass++) {
    for (var p2 = 0; p2 < allPairs.length; p2++) {
      var a2 = allPairs[p2][0], b2 = allPairs[p2][1];
      if (playedPair[a2 + "-" + b2]) continue;
      if (teamGamesCount[a2] >= 17 || teamGamesCount[b2] >= 17) continue;
      for (var w2 = 1; w2 <= 18; w2++) {
        if (weekByes[w2][a2] || weekByes[w2][b2]) continue;
        var aBusy = false, bBusy = false;
        for (var m = 0; m < schedByWk[w2].length; m++) {
          if (schedByWk[w2][m][0] === a2 || schedByWk[w2][m][1] === a2) aBusy = true;
          if (schedByWk[w2][m][0] === b2 || schedByWk[w2][m][1] === b2) bBusy = true;
        }
        if (!aBusy && !bBusy) {
          schedByWk[w2].push([a2, b2]);
          playedPair[a2 + "-" + b2] = true;
          teamGamesCount[a2]++;
          teamGamesCount[b2]++;
          break;
        }
      }
    }
  }
  return schedByWk;
}

function teamLogo(abbr, large) {
  if (!abbr || !TEAMS[abbr]) {

  var t = TEAMS[abbr];
  var cls = large ? "tm-logo-lg" : "tm-logo-sm";
  var url = "https://a.espncdn.com/i/teamlogos/nfl/500/" + t.slug + ".png";
  var fb = '<span class="badge-fallback" style="display:none;background:' + t.bg + ';color:' + t.fg + ';border:1px solid rgba(255,255,255,0.22);">' + abbr + '</span>';
  return '<img class="' + cls + '" src="' + url + '" alt="' + abbr + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'inline-flex\';">' + fb;
}

function fmtPct(pct) {
  var s = (Number(pct) || 0).toFixed(3);
  return s.indexOf("0.") === 0 ? s.slice(1) : s;
}

function fmtRec(st) {
  return st.w + "-" + st.l + (st.t ? "-" + st.t : "");
}

function saveState() {
  try {
    if (window.localStorage) {
      window.localStorage.setItem("pp_18wk_iphone_v6_reg", JSON.stringify(games));
      window.localStorage.setItem("pp_18wk_iphone_v6_po", JSON.stringify(playoffGames));
      window.localStorage.setItem("pp_18wk_stats_mode", showScoresAndStats ? "1" : "0");
    }
  } catch (e) {}
}

function loadState() {
  initPlayoffShells();
  try {
    if (window.localStorage) {
      var m = window.localStorage.getItem("pp_18wk_stats_mode");
      if (m === "0") showScoresAndStats = false;
      else if (m === "1") showScoresAndStats = true;

      var rawPo = window.localStorage.getItem("pp_18wk_iphone_v6_po");
      if (rawPo) {
        var parsedPo = JSON.parse(rawPo);
        if (parsedPo && parsedPo.WC && parsedPo.DIV && parsedPo.CCG && parsedPo.SB) {
          playoffGames = parsedPo;
        }
      }

      var raw = window.localStorage.getItem("pp_18wk_iphone_v6_reg");
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.length >= 250) { games = parsed; return; }
      }
    }
  } catch (e) {}
  buildFreshSchedule();
}

function buildFreshSchedule() {
  SCHED = generateBalanced18WeekSchedule();
  games = [];

  var id = 0;
  for (var wk = 1; wk <= 18; wk++) {
    var list = SCHED[wk] || [];
    for (var i = 0; i < list.length; i++) {
      games.push({ id: id++, wk: wk, away: list[i][0], home: list[i][1], aPts: null, hPts: null, played: false });

}

function resetSeason() {

}

function applyStatsVisibility() {

function updateStageNavButtons() {

  if (!wkSel || !prevBtn || !nextBtn) return;

function stepStage(delta) {
  var wkSel = document.getElementById("weekSelect");
  if (!wkSel) return;
  var nextIdx = wkSel.selectedIndex + delta;
  if (nextIdx >= 0 && nextIdx < wkSel.options.length) {

function simPair(away, home, neutral) {
  var pa = TEAMS[away].pwr + (neutral ? 0 : -1.5);
  var ph = TEAMS[home].pwr + (neutral ? 0 : 1.5);
  var edge = (pa - ph) * 0.24;
  var g1 = function() { return (Math.random() + Math.random() + Math.random() - 1.5) * 12; };
  return [
    Math.max(3, Math.round(22.5 + edge + g1())),
    Math.max(3, Math.round(22.5 - edge + g1()))
  ];
}

function getGameWinner(g) {
  if (!g || !g.played || g.aPts === null || g.hPts === null || !g.away || !g.home) return null;
  if (g.aPts > g.hPts) return g.away;
  if (g.hPts > g.aPts) return g.home;
  if (g.aSeed && g.hSeed) return g.aSeed < g.hSeed ? g.away : g.home;
  return g.home;
}

function syncPlayoffMatchups() {
  var confs = ["AFC", "NFC"];
  for (var c = 0; c < confs.length; c++) {
    var conf = confs[c];
    var seeds = seedsByConf[conf] || [];
    var s1 = seeds[0] || null;
    var s2 = seeds[1] || null;
    var s3 = seeds[2] || null;
    var s4 = seeds[3] || null;
    var s5 = seeds[4] || null;
    var s6 = seeds[5] || null;
    var s7 = seeds[6] || null;

    var seedRank = {};
    for (var i = 0; i < seeds.length; i++) seedRank[seeds[i]] = i + 1;

    var wcList = playoffGames.WC.filter(function(g) { return g.conf === conf; });
    var wcMatchups = [
      { g: wcList[0], away: s7, home: s2, aSeed: 7, hSeed: 2, label: conf + " WC • #7 at #2" },
      { g: wcList[1], away: s6, home: s3, aSeed: 6, hSeed: 3, label: conf + " WC • #6 at #3" },
      { g: wcList[2], away: s5, home: s4, aSeed: 5, hSeed: 4, label: conf + " WC • #5 at #4" }
    ];

    var wcWinners = [];
    var allWcDone = true;
    for (var w = 0; w < wcMatchups.length; w++) {
      var m = wcMatchups[w];
      if (!m.g) continue;
      if (m.g.away !== m.away || m.g.home !== m.home) {
        m.g.aPts = null;
        m.g.hPts = null;
        m.g.played = false;
      }
      m.g.away = m.away;
      m.g.home = m.home;
      m.g.aSeed = m.aSeed;
      m.g.hSeed = m.hSeed;
      m.g.label = m.label;

      var winTm = getGameWinner(m.g);
      if (winTm) wcWinners.push(winTm);
      else allWcDone = false;
    }

    var divList = playoffGames.DIV.filter(function(g) { return g.conf === conf; });
    var divA = divList[0];
    var divB = divList[1];

    if (allWcDone && s1 && wcWinners.length === 3) {
      wcWinners.sort(function(a, b) { return (seedRank[b] || 99) - (seedRank[a] || 99); });
      var lowestSeedTm = wcWinners[0];
      var otherTwo = [wcWinners[1], wcWinners[2]].sort(function(a, b) { return (seedRank[a] || 99) - (seedRank[b] || 99); });
      var highOther = otherTwo[0];
      var lowOther = otherTwo[1];

      var nextAwayA = lowestSeedTm;
      var nextHomeA = s1;
      if (divA.away !== nextAwayA || divA.home !== nextHomeA) {
        divA.aPts = null; divA.hPts = null; divA.played = false;
      }
      divA.away = nextAwayA;
      divA.home = nextHomeA;
      divA.aSeed = seedRank[nextAwayA] || null;
      divA.hSeed = 1;
      divA.label = conf + " DIV • #" + (seedRank[nextAwayA] || "?") + " at #1";

      var nextAwayB = lowOther;
      var nextHomeB = highOther;
      if (divB.away !== nextAwayB || divB.home !== nextHomeB) {
        divB.aPts = null; divB.hPts = null; divB.played = false;
      }
      divB.away = nextAwayB;
      divB.home = nextHomeB;
      divB.aSeed = seedRank[nextAwayB] || null;
      divB.hSeed = seedRank[nextHomeB] || null;
      divB.label = conf + " DIV • #" + (seedRank[nextAwayB] || "?") + " at #" + (seedRank[nextHomeB] || "?");
    } else {
      for (var dIdx = 0; dIdx < divList.length; dIdx++) {
        divList[dIdx].away = null;
        divList[dIdx].home = null;
        divList[dIdx].aPts = null;
        divList[dIdx].hPts = null;
        divList[dIdx].played = false;
      }
    }

    var ccg = playoffGames.CCG.filter(function(g) { return g.conf === conf; })[0];
    var winA = getGameWinner(divA);
    var winB = getGameWinner(divB);
    if (winA && winB) {
      var pair = [winA, winB].sort(function(a, b) { return (seedRank[a] || 99) - (seedRank[b] || 99); });
      var ccgHome = pair[0];
      var ccgAway = pair[1];
      if (ccg.away !== ccgAway || ccg.home !== ccgHome) {
        ccg.aPts = null; ccg.hPts = null; ccg.played = false;
      }
      ccg.away = ccgAway;
      ccg.home = ccgHome;
      ccg.aSeed = seedRank[ccgAway] || null;
      ccg.hSeed = seedRank[ccgHome] || null;
      ccg.label = conf + " Championship • #" + (seedRank[ccgAway] || "?") + " at #" + (seedRank[ccgHome] || "?");
    } else {
      ccg.away = null;
      ccg.home = null;
      ccg.aPts = null;
      ccg.hPts = null;
      ccg.played = false;
    }
  }

  var sb = playoffGames.SB[0];
  var afcChamp = getGameWinner(playoffGames.CCG.filter(function(g) { return g.conf === "AFC"; })[0]);
  var nfcChamp = getGameWinner(playoffGames.CCG.filter(function(g) { return g.conf === "NFC"; })[0]);
  if (afcChamp && nfcChamp) {
    if (sb.away !== afcChamp || sb.home !== nfcChamp) {
      sb.aPts = null; sb.hPts = null; sb.played = false;
    }
    sb.away = afcChamp;
    sb.home = nfcChamp;
    sb.label = "Super Bowl • " + afcChamp + " vs " + nfcChamp;
  } else {
    sb.away = null;
    sb.home = null;
    sb.aPts = null;
    sb.hPts = null;
    sb.played = false;
  }
}

function findPlayoffGame(pgid) {
  var stgKeys = ["WC", "DIV", "CCG", "SB"];
  for (var s = 0; s < stgKeys.length; s++) {
    var arr = playoffGames[stgKeys[s]] || [];
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === pgid) return arr[i];
    }
  }
  return null;
}

function setPlayoffGameResult(pgid, ap, hp) {
  var g = findPlayoffGame(pgid);
  if (!g || !g.away || !g.home) return;
  var aVal = Math.max(0, Number(ap) || 0);
  var hVal = Math.max(0, Number(hp) || 0);
  if (aVal === hVal) aVal += 3;
  g.aPts = aVal;
  g.hPts = hVal;
  g.played = true;
  saveState();
  recomputeAll();
}

function pickPlayoffWinner(pgid, side) {
  var g = findPlayoffGame(pgid);
  if (!g || !g.away || !g.home) return;
  var aEl = document.getElementById("pa-pts-" + pgid);
  var hEl = document.getElementById("ph-pts-" + pgid);
  var ca = (aEl && aEl.value !== "") ? Number(aEl.value) : null;
  var ch = (hEl && hEl.value !== "") ? Number(hEl.value) : null;
  if (side === "away") {
    if (ca !== null && ch !== null && ca > ch) setPlayoffGameResult(pgid, ca, ch);
    else setPlayoffGameResult(pgid, Math.max(ca !== null ? ca : 24, (ch !== null ? ch : 20) + 3), ch !== null ? ch : 20);
  } else {
    if (ca !== null && ch !== null && ch > ca) setPlayoffGameResult(pgid, ca, ch);
    else setPlayoffGameResult(pgid, ca !== null ? ca : 20, Math.max(ch !== null ? ch : 24, (ca !== null ? ca : 20) + 3));
  }
}

function clearPlayoffGame(pgid) {
  var g = findPlayoffGame(pgid);
  if (!g) return;
  g.aPts = null;
  g.hPts = null;
  g.played = false;
  saveState();
  recomputeAll();
}

function simStage(stageKey) {
  recomputeAll();
  var list = playoffGames[stageKey] || [];
  for (var i = 0; i < list.length; i++) {
    var g = list[i];
    if (g.away && g.home && !g.played) {
      var res = simPair(g.away, g.home, !!g.neutral);
      var ap = res[0], hp = res[1];
      if (ap === hp) ap += 3;
      g.aPts = ap;
      g.hPts = hp;
      g.played = true;
    }
  }
  saveState();
  recomputeAll();
}

function simCurrentWeek() {
  var selVal = document.getElementById("weekSelect").value || "1";
  if (selVal === "WC" || selVal === "DIV" || selVal === "CCG" || selVal === "SB") {
    simStage(selVal);
    return;
  }
  var wk = Number(selVal) || 1;
  for (var i = 0; i < games.length; i++) {
    var g = games[i];
    if (g.wk === wk && !g.played) {
      var res = simPair(g.away, g.home, false);
      g.aPts = res[0]; g.hPts = res[1]; g.played = true;
    }
  }
  saveState();
  recomputeAll();
}

function simAllWeeks() {
  for (var i = 0; i < games.length; i++) {
    var g = games[i];
    if (!g.played) {
      var res = simPair(g.away, g.home, false);
      g.aPts = res[0]; g.hPts = res[1]; g.played = true;
    }
  }
  saveState();
  recomputeAll();
}

function findGame(gid) {
  for (var i = 0; i < games.length; i++) {
    if (games[i].id === gid) return games[i];
  }
  return null;
}

function setGameResult(gid, ap, hp) {
  var g = findGame(gid);
  if (!g) return;
  g.aPts = Math.max(0, Number(ap) || 0);
  g.hPts = Math.max(0, Number(hp) || 0);
  g.played = true;
  saveState();
  recomputeAll();
}

function pickWinner(gid, side) {
  var g = findGame(gid);
  if (!g) return;
  var aEl = document.getElementById("a-pts-" + gid);
  var hEl = document.getElementById("h-pts-" + gid);
  var ca = (aEl && aEl.value !== "") ? Number(aEl.value) : null;
  var ch = (hEl && hEl.value !== "") ? Number(hEl.value) : null;
  if (side === "away") {
    if (ca !== null && ch !== null && ca > ch) setGameResult(gid, ca, ch);
    else setGameResult(gid, Math.max(ca !== null ? ca : 24, (ch !== null ? ch : 20) + 3), ch !== null ? ch : 20);
  } else {
    if (ca !== null && ch !== null && ch > ca) setGameResult(gid, ca, ch);
    else setGameResult(gid, ca !== null ? ca : 20, Math.max(ch !== null ? ch : 24, (ca !== null ? ca : 20) + 3));
  }
}

function pickTie(gid) {
  var aEl = document.getElementById("a-pts-" + gid);
  var hEl = document.getElementById("h-pts-" + gid);
  var ca = (aEl && aEl.value !== "") ? Number(aEl.value) : null;
  var ch = (hEl && hEl.value !== "") ? Number(hEl.value) : null;
  var t = (ca !== null && ca === ch) ? ca : (ca !== null ? ca : (ch !== null ? ch : 23));
  setGameResult(gid, t, t);
}

function clearGame(gid) {
  var g = findGame(gid);
  if (!g) return;
  g.aPts = null; g.hPts = null; g.played = false;
  saveState();
  recomputeAll();
}

function recomputeAll() {
  stats = {};
  var allAbbrs = Object.keys(TEAMS);
  for (var i = 0; i < allAbbrs.length; i++) {
    stats[allAbbrs[i]] = { w: 0, l: 0, t: 0, pf: 0, pa: 0, gp: 0, pct: 0 };
  }
  for (var j = 0; j < games.length; j++) {
    var g = games[j];
    if (!g.played || g.aPts === null || g.hPts === null) continue;
    var entries = [[g.away, g.aPts, g.hPts], [g.home, g.hPts, g.aPts]];
    for (var k = 0; k < entries.length; k++) {
      var tm = entries[k][0], pf = entries[k][1], pa = entries[k][2];
      var s = stats[tm];
      s.pf += pf; s.pa += pa; s.gp += 1;
      if (pf > pa) s.w += 1;
      else if (pa > pf) s.l += 1;
      else s.t += 1;
      s.pct = (s.w + 0.5 * s.t) / s.gp;
    }
  }

  function rankKey(abbr) {
    var s = stats[abbr];
    var gp = Math.max(1, s.gp);
    var diffPg = s.gp ? (s.pf - s.pa) / gp : 0;
    return [Number(s.pct.toFixed(4)), Number(diffPg.toFixed(3)), s.pf - s.pa, TEAMS[abbr].pwr];
  }
  function cmpDesc(a, b) {
    var ka = rankKey(a), kb = rankKey(b);
    for (var x = 0; x < ka.length; x++) {
      if (kb[x] !== ka[x]) return kb[x] - ka[x];
    }
    return 0;
  }

  var confs = ["AFC", "NFC"];
  var divNames = ["East", "North", "South", "West"];
  for (var cIdx = 0; cIdx < confs.length; cIdx++) {
    var conf = confs[cIdx];
    var cTeams = [];
    for (var tIdx = 0; tIdx < allAbbrs.length; tIdx++) {
      if (TEAMS[allAbbrs[tIdx]].conf === conf) cTeams.push(allAbbrs[tIdx]);
    }
    var divs = { East: [], North: [], South: [], West: [] };
    for (var u = 0; u < cTeams.length; u++) {
      divs[TEAMS[cTeams[u]].div].push(cTeams[u]);
    }
    var champs = [], rest = [];
    for (var dIdx = 0; dIdx < divNames.length; dIdx++) {
      var ordered = divs[divNames[dIdx]].sort(cmpDesc);
      champs.push(ordered[0]);
      for (var rIdx = 1; rIdx < ordered.length; rIdx++) rest.push(ordered[rIdx]);
    }
    champs.sort(cmpDesc);
    divChamps[conf] = {};
    for (var chIdx = 0; chIdx < champs.length; chIdx++) divChamps[conf][champs[chIdx]] = true;

    var wcs = rest.sort(cmpDesc).slice(0, 3);
    var seeded = champs.concat(wcs);
    var unseeded = [];
    for (var nIdx = 0; nIdx < cTeams.length; nIdx++) {
      if (seeded.indexOf(cTeams[nIdx]) === -1) unseeded.push(cTeams[nIdx]);
    }
    unseeded.sort(cmpDesc);
    seedsByConf[conf] = seeded.concat(unseeded);
  }

  leagueOrder = allAbbrs.slice().sort(cmpDesc);
  syncPlayoffMatchups();
  applyStatsVisibility();
  updateStageNavButtons();
  renderGames();
  renderStandings();
  renderTeamSchedule();
  renderPlayoffSeeds();
}

function seedClass(conf, tm, seedNum) {
  if (seedNum === 1) return "seed-1";
  if (seedNum <= 4 || divChamps[conf][tm]) return "seed-div";
  if (seedNum <= 7) return "seed-wc";
  return "seed-out";
}

function renderPlayoffRoundCards(stageKey) {

      '</div>' +

        '<div class="team-left">' + teamLogo(g.home, true) +
          '<span class="team-meta">' + hSeedStr + g.home + ' (' + fmtRec(hSt) + ') <span class="pct-tag">' + fmtPct(hSt.pct) + '</span></span>' +
        '</div>' +
        '<input id="ph-pts-' + g.id + '" class="' + scoreCls + '" type="number" min="0" value="' + (g.hPts !== null ? g.hPts : "") + '" onclick="event.stopPropagation()">' +
      '</div>' +
      '<div class="' + actCls + '">' +
        '<button class="b-amber" onclick="setPlayoffGameResult(\'' + g.id + '\', document.getElementById(\'pa-pts-' + g.id + '\').value, document.getElementById(\'ph-pts-' + g.id + '\').value)">Set Score</button>' +
        '<button class="b-red" onclick="clearPlayoffGame(\'' + g.id + '\')">Clear</button>' +
      '</div>' +
    '</div>';
  }
  return html;
}

function renderGames() {

  for (var i = 0; i < games.length; i++) {

    if (g.wk !== wk) continue;
    var aSt = stats[g.away], hSt = stats[g.home];
    var aWon = g.played && g.aPts > g.hPts;

    html += '<div class="card">' +

        '<div class="team-left">' + teamLogo(g.away, true) +
          '<span class="team-meta">' + g.away + ' (' + fmtRec(aSt) + ') <span class="pct-tag">' + fmtPct(aSt.pct) + '</span></span>' +
        '</div>' +
        '<input id="a-pts-' + g.id + '" class="' + scoreCls + '" type="number" min="0" value="' + (g.aPts !== null ? g.aPts : "") + '" onclick="event.stopPropagation()">' +
      '</div>' +
      '<div class="team-pick-row ' + (hWon ? "winner" : "") + '" onclick="pickWinner(' + g.id + ', \'home\')">' +
        '<div class="team-left">' + teamLogo(g.home, true) +
          '<span class="team-meta">' + g.home + ' (' + fmtRec(hSt) + ') <span class="pct-tag">' + fmtPct(hSt.pct) + '</span></span>' +
        '</div>' +
        '<input id="h-pts-' + g.id + '" class="' + scoreCls + '" type="number" min="0" value="' + (g.hPts !== null ? g.hPts : "") + '" onclick="event.stopPropagation()">' +
      '</div>' +
      '<div class="' + actCls + '">' +
        '<button class="b-grey" onclick="pickTie(' + g.id + ')">Tie</button>' +
        '<button class="b-amber" onclick="setGameResult(' + g.id + ', document.getElementById(\'a-pts-' + g.id + '\').value, document.getElementById(\'h-pts-' + g.id + '\').value)">Set Score</button>' +
        '<button class="b-red" onclick="clearGame(' + g.id + ')">Clear</button>' +
      '</div>' +
    '</div>';
  }
  wrap.innerHTML = html;
}

function setStandingsMode(mode) {
  standingsMode = mode;
  var modes = ["Division", "Conference", "League"];
  for (var i = 0; i < modes.length; i++) {
    var el = document.getElementById("pill-" + modes[i]);
    if (modes[i] === mode) el.className = "pill active";
    else el.className = "pill";
  }
  renderStandings();
}

function teamRowHtml(rkLabel, tm, cls) {
  var s = stats[tm];
  var gp = Math.max(1, s.gp);
  var ppg = s.gp ? (s.pf / gp).toFixed(1) : "0.0";
  var ppa = s.gp ? (s.pa / gp).toFixed(1) : "0.0";
  var diff = s.pf - s.pa;
  var hideCol = showScoresAndStats ? "" : " hidden-el";
  return '<tr class="' + cls + '">' +
    '<td>' + rkLabel + '</td>' +
    '<td class="tm-cell">' + teamLogo(tm, false) + tm + '</td>' +
    '<td>' + fmtRec(s) + '</td>' +
    '<td>' + fmtPct(s.pct) + '</td>' +
    '<td class="' + hideCol + '">' + ppg + '</td>' +
    '<td class="' + hideCol + '">' + ppa + '</td>' +
    '<td class="' + hideCol + '">' + (diff > 0 ? "+" + diff : diff) + '</td>' +
  '</tr>';
}

function renderStandings() {
  var body = document.getElementById("standingsBody");
  var html = "";
  var colspan = showScoresAndStats ? 7 : 4;
  var confs = ["AFC", "NFC"];
  var divNames = ["East", "North", "South", "West"];
  if (standingsMode === "Division") {
    for (var c = 0; c < confs.length; c++) {
      for (var d = 0; d < divNames.length; d++) {
        var conf = confs[c], div = divNames[d];
        html += '<tr class="group-hdr"><td colspan="' + colspan + '">' + conf + ' ' + div + '</td></tr>';
        var pos = 0;
        for (var i = 0; i < seedsByConf[conf].length; i++) {
          var tm = seedsByConf[conf][i];
          if (TEAMS[tm].div === div) {
            pos++;
            var sd = i + 1;
            html += teamRowHtml(pos + "(#" + sd + ")", tm, seedClass(conf, tm, sd));
          }
        }
      }
    }
  } else if (standingsMode === "Conference") {
    for (var c2 = 0; c2 < confs.length; c2++) {
      var conf2 = confs[c2];
      html += '<tr class="group-hdr"><td colspan="' + colspan + '">' + conf2 + ' Conference</td></tr>';
      for (var j = 0; j < seedsByConf[conf2].length; j++) {
        var sd2 = j + 1;
        html += teamRowHtml("#" + sd2, seedsByConf[conf2][j], seedClass(conf2, seedsByConf[conf2][j], sd2));
      }
    }
  } else {
    for (var k = 0; k < leagueOrder.length; k++) {
      var tm3 = leagueOrder[k];
      var conf3 = TEAMS[tm3].conf;
      var sd3 = seedsByConf[conf3].indexOf(tm3) + 1;
      html += teamRowHtml("#" + (k + 1), tm3, seedClass(conf3, tm3, sd3));
    }
  }
  body.innerHTML = html;
}

function renderTeamSchedule() {
  var tm = document.getElementById("teamSelect").value || "KC";
  var s = stats[tm];
  var gp = Math.max(1, s.gp);
  var ppg = s.gp ? (s.pf / gp).toFixed(1) : "0.0";
  var ppa = s.gp ? (s.pa / gp).toFixed(1) : "0.0";
  document.getElementById("teamSummary").textContent = showScoresAndStats
    ? (fmtRec(s) + " (" + fmtPct(s.pct) + ") • PPG " + ppg + " • PPA " + ppa)
    : (fmtRec(s) + " (" + fmtPct(s.pct) + ")");

  var mapByWk = {};
  for (var i = 0; i < games.length; i++) {
    if (games[i].away === tm || games[i].home === tm) mapByWk[games[i].wk] = games[i];
  }

  var runPf = 0, runPa = 0, runGp = 0, runW = 0, runL = 0, runT = 0;
  var rows = "";
  var hideCol = showScoresAndStats ? "" : " hidden-el";
  for (var wk = 1; wk <= 18; wk++) {
    var g = mapByWk[wk];
    if (!g) {
      rows += '<tr><td>W' + wk + '</td><td>BYE</td><td>-</td><td>-</td><td>-</td><td class="' + hideCol + '">-</td><td class="' + hideCol + '">-</td></tr>';
      continue;
    }
    var isAway = g.away === tm;
    var opp = isAway ? g.home : g.away;
    var loc = isAway ? "@" : "vs";
    if (!g.played) {
      rows += '<tr><td>W' + wk + '</td><td class="tm-cell">' + loc + ' ' + teamLogo(opp, false) + opp + '</td><td>TBD</td><td>-</td><td>-</td><td class="' + hideCol + '">-</td><td class="' + hideCol + '">-</td></tr>';
      continue;
    }
    var pf = isAway ? g.aPts : g.hPts;
    var pa = isAway ? g.hPts : g.aPts;
    runPf += pf; runPa += pa; runGp += 1;
    var res = "T";
    if (pf > pa) { runW += 1; res = "W"; }
    else if (pa > pf) { runL += 1; res = "L"; }
    var cPct = (runW + 0.5 * runT) / runGp;
    var scoreText = showScoresAndStats ? (pf + "-" + pa) : res;
    rows += '<tr><td>W' + wk + '</td><td class="tm-cell">' + loc + ' ' + teamLogo(opp, false) + opp + '</td><td>' + res + '</td><td>' + scoreText + '</td>' +
      '<td>' + fmtPct(cPct) + '</td><td class="' + hideCol + '">' + (runPf / runGp).toFixed(1) + '</td><td class="' + hideCol + '">' + (runPa / runGp).toFixed(1) + '</td></tr>';
  }
  document.getElementById("teamSchedBody").innerHTML = rows;
}

function renderPlayoffSeeds() {
  var pairs = [["AFC", "afcSeedsBody"], ["NFC", "nfcSeedsBody"]];
  for (var p = 0; p < pairs.length; p++) {
    var conf = pairs[p][0], id = pairs[p][1];
    var html = "";
    for (var i = 0; i < seedsByConf[conf].length; i++) {
      var tm = seedsByConf[conf][i];
      var sd = i + 1;
      var s = stats[tm];
      html += '<tr class="' + seedClass(conf, tm, sd) + '">' +
        '<td>#' + sd + '</td>' +
        '<td class="tm-cell">' + teamLogo(tm, false) + tm + '</td>' +
        '<td>' + fmtRec(s) + '</td>' +
        '<td>' + fmtPct(s.pct) + '</td>' +
      '</tr>';
    }
    document.getElementById(id).innerHTML = html;
  }
  renderBracketSummary();
}

function renderBracketSummary() {
  var out = "";
  var confs = ["AFC", "NFC"];
  for (var c = 0; c < confs.length; c++) {
    var conf = confs[c];
    out += "=== " + conf + " ===\n";
    var wc = playoffGames.WC.filter(function(g) { return g.conf === conf; });
    for (var w = 0; w < wc.length; w++) {
      var wg = wc[w];
      if (!wg.away || !wg.home) { out += "WC: TBD\n"; continue; }
      var wWin = getGameWinner(wg);
      out += "WC: " + wg.away + " @ " + wg.home + (wg.played ? (" (" + wg.aPts + "-" + wg.hPts + ") -> " + wWin) : " [unplayed]") + "\n";
    }
    var div = playoffGames.DIV.filter(function(g) { return g.conf === conf; });
    for (var d = 0; d < div.length; d++) {
      var dg = div[d];
      if (!dg.away || !dg.home) { out += "DIV: Pending\n"; continue; }
      var dWin = getGameWinner(dg);
      out += "DIV: " + dg.away + " @ " + dg.home + (dg.played ? (" (" + dg.aPts + "-" + dg.hPts + ") -> " + dWin) : " [unplayed]") + "\n";
    }
    var ccg = playoffGames.CCG.filter(function(g) { return g.conf === conf; })[0];
    if (!ccg || !ccg.away || !ccg.home) { out += "CCG: Pending\n\n"; continue; }
    var cWin = getGameWinner(ccg);
    out += "CCG: " + ccg.away + " @ " + ccg.home + (ccg.played ? (" (" + ccg.aPts + "-" + ccg.hPts + ") -> " + cWin) : " [unplayed]") + "\n\n";
  }
  var sb = playoffGames.SB[0];
  if (sb && sb.away && sb.home) {
    var sbWin = getGameWinner(sb);
    out += "SUPER BOWL: " + sb.away + " vs " + sb.home + (sb.played ? (" (" + sb.aPts + "-" + sb.hPts + ") -> CHAMP: " + sbWin) : " [unplayed]");
  } else {
    out += "SUPER BOWL: Pending Conference Champions";
  }
  var el = document.getElementById("bracketOutput");
  if (el) el.textContent = out;
}

function simBracket() {
  recomputeAll();
  var order = ["WC", "DIV", "CCG", "SB"];
  for (var s = 0; s < order.length; s++) {
    syncPlayoffMatchups();
    var list = playoffGames[order[s]] || [];
    for (var i = 0; i < list.length; i++) {
      var g = list[i];
      if (g.away && g.home) {
        var res = simPair(g.away, g.home, !!g.neutral);
        var ap = res[0], hp = res[1];
        if (ap === hp) ap += 3;
        g.aPts = ap;
        g.hPts = hp;
        g.played = true;
      }
    }
  }
  saveState();
  recomputeAll();
}

function switchTab(tab) {
  var tabs = ["games", "standings", "team", "playoffs"];
  for (var i = 0; i < tabs.length; i++) {
    var t = tabs[i];
    document.getElementById("tab-" + t).className = (t === tab) ? "active" : "";
    document.getElementById("nav-" + t).className = (t === tab) ? "active" : "";
  }
}

function initUI() {
  var wkSel = document.getElementById("weekSelect");
  for (var s = 0; s < STAGES.length; s++) {
    var val = STAGES[s];
    var opt = document.createElement("option");
    opt.value = val;
    if (val === "WC") opt.textContent = "Wild Card (WC)";
    else if (val === "DIV") opt.textContent = "Divisional (DIV)";
    else if (val === "CCG") opt.textContent = "Conf Champ (CCG)";
    else if (val === "SB") opt.textContent = "Super Bowl (SB)";
    else opt.textContent = "Week " + val;
    wkSel.appendChild(opt);
  }
  wkSel.value = "1";
  wkSel.onchange = function() {
    updateStageNavButtons();
    renderGames();
  };

  var tmSel = document.getElementById("teamSelect");
  var keys = Object.keys(TEAMS).sort();
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    var tOpt = document.createElement("option");
    tOpt.value = k;
    tOpt.textContent = k + " — " + TEAMS[k].name;
    tmSel.appendChild(tOpt);
  }
  tmSel.value = "KC";
  tmSel.onchange = renderTeamSchedule;

  loadState();
  recomputeAll();
}

initUI();
</script>
</body>
</html>
